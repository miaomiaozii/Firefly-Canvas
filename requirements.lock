# 依赖锁文件：每个包（含传递依赖）都钉到确切版本，离线安装与便携包都用它。
# 与 requirements.txt 的分工：那份写「要什么、允许什么范围」，这份写「这次装出来的确切版本」。
#
# 生成方式（必须用 Python 3.12，便携包就是 3.12.10；换 Python 版本要重新生成）：
#   python -m venv .venv312 && .venv312\Scripts\python -m pip install -r requirements.txt
#   .venv312\Scripts\python -m pip freeze | grep -v "^pip==" | grep -v "^setuptools==" > requirements.lock
# 或直接用：python tools/offline_packages.py download
#
# 平台：wheel 只取 cp312 / win_amd64 与 py3-none-any（见 tools/offline_packages.py）。
# 改 requirements.txt 后必须重新生成并同步 packages/，否则离线安装会缺包（Refs #362）。
