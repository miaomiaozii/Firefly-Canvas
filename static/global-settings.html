<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="globalSettings.title">萤火画布 · 全局设置</title>
  <script>
    // The Smart Canvas settings panel owns its responsive width.  Opt out of
    // the standalone page's desktop UI scale before theme.js initializes so
    // embedded controls keep their intended readable size.
    if (window.self !== window.top) document.documentElement.dataset.studioScale = 'off';
  </script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/global-preferences.js?v=20261026.214956.6237"></script>
  <link rel="stylesheet" href="/static/css/studio-foundation.css?v=20261026.214956.6237">
  <link rel="stylesheet" href="/static/css/global-settings.css?v=20261029.153817.0262">
</head>
<body>
  <main class="settings-shell">
    <header class="settings-header">
      <button id="backButton" class="quiet-button" type="button" data-i18n="globalSettings.back">← 返回</button>
      <div>
        <p class="eyebrow">FIREFLY CANVAS</p>
        <h1 data-i18n="globalSettings.heading">全局设置</h1>
        <p class="subtitle" data-i18n="globalSettings.subtitle">跨项目共享的在线服务、项目库与应用偏好。</p>
      </div>
      <button id="refreshAll" class="quiet-button" type="button" data-i18n="globalSettings.refresh">刷新状态</button>
    </header>

    <p id="pageStatus" class="page-status" role="status" aria-live="polite" data-i18n="globalSettings.loading">正在读取设置…</p>

    <section class="settings-section" aria-labelledby="preferencesTitle">
      <div class="section-heading">
        <div><p class="section-index">01</p><h2 id="preferencesTitle" data-i18n="globalSettings.preferences">外观、语言与保存</h2></div>
        <button id="savePreferences" class="primary-button" type="button" data-i18n="globalSettings.savePreferences">保存偏好</button>
      </div>
      <div class="preference-grid">
        <label><span data-i18n="globalSettings.theme">主题</span><select id="themeSelect"><option value="dark" data-i18n="globalSettings.dark">深色</option><option value="light" data-i18n="globalSettings.light">浅色</option></select></label>
        <label><span data-i18n="globalSettings.language">语言</span><select id="languageSelect"><option value="zh" data-i18n="globalSettings.chinese">简体中文</option><option value="en" data-i18n="globalSettings.english">English</option></select></label>
      </div>
    </section>

    <section class="settings-section" aria-labelledby="providersTitle">
      <div class="section-heading">
        <div><p class="section-index">02</p><h2 id="providersTitle" data-i18n="globalSettings.providers">在线服务商与模型</h2></div>
        <div class="heading-actions">
          <button id="addProvider" class="quiet-button" type="button" data-i18n="globalSettings.addProvider">添加服务商</button>
          <button id="saveProviders" class="primary-button" type="button" data-i18n="globalSettings.saveProviders">保存服务商</button>
        </div>
      </div>
      <p class="section-note" data-i18n="globalSettings.keyNote">Key 写入本机全局 API/.env；页面只显示脱敏尾号，留空不会覆盖已有 Key。</p>
      <div id="providerList" class="provider-list"></div>
    </section>

    <section class="settings-section" aria-labelledby="cliTitle">
      <div class="section-heading">
        <div><p class="section-index">03</p><h2 id="cliTitle" data-i18n="globalSettings.cli">CLI 状态</h2></div>
      </div>
      <div id="cliGrid" class="status-grid" aria-live="polite"></div>
    </section>

    <section class="settings-section" aria-labelledby="libraryTitle">
      <div class="section-heading">
        <div><p class="section-index">04</p><h2 id="libraryTitle" data-i18n="globalSettings.library">项目库</h2></div>
      </div>
      <p id="librarySummary" class="section-note"></p>
      <form id="libraryForm" class="library-form">
        <label><span data-i18n="globalSettings.libraryPath">新的项目库绝对路径</span><input id="libraryPath" name="path" autocomplete="off" required></label>
        <label class="confirmation"><input id="moveExisting" type="checkbox"><span data-i18n="globalSettings.moveExisting">显式移动当前项目；复制并完整校验成功后才切换</span></label>
        <button class="danger-button" type="submit" data-i18n="globalSettings.switchLibrary">校验并切换项目库</button>
      </form>
      <p class="safety-note" data-i18n="globalSettings.safety">为保护作品，切换成功后原项目库会保留为安全副本；确认新库无误后再由你自行清理。</p>
    </section>

    <section class="settings-section" aria-labelledby="psTitle">
      <div class="section-heading">
        <div><p class="section-index">05</p><h2 id="psTitle" data-i18n="globalSettings.photoshop">Photoshop 连接状态</h2></div>
      </div>
      <div id="photoshopStatus" class="connection-card"></div>
    </section>

    <section class="settings-section" aria-labelledby="tasksTitle">
      <div class="section-heading">
        <div><p class="section-index">06</p><h2 id="tasksTitle" data-i18n="globalSettings.tasksConsole">全局任务总控台</h2></div>
        <div class="heading-actions">
          <label class="console-autorefresh"><input id="consoleAutoRefresh" type="checkbox" checked> <span data-i18n="globalSettings.tasksAutoRefresh">自动刷新（2s）</span></label>
          <button id="consoleRefresh" class="quiet-button" type="button" data-i18n="globalSettings.tasksRefresh">刷新任务</button>
        </div>
      </div>
      <p class="section-note" data-i18n="globalSettings.tasksNote">跨项目的在飞与近期任务；点「查看」跳转到产物所在画布并定位节点，点「取消」复用项目任务取消通道。</p>
      <div class="console-filters">
        <label><span data-i18n="globalSettings.tasksFilterStatus">状态</span><select id="consoleStatusFilter"><option value="">全部</option><option value="active" data-i18n="globalSettings.tasksFilterActive">在飞（排队/运行）</option><option value="queued" data-i18n="globalSettings.tasksStatusQueued">排队</option><option value="running" data-i18n="globalSettings.tasksStatusRunning">运行中</option><option value="succeeded" data-i18n="globalSettings.tasksStatusSucceeded">成功</option><option value="failed" data-i18n="globalSettings.tasksStatusFailed">失败</option><option value="cancelled" data-i18n="globalSettings.tasksStatusCancelled">已取消</option></select></label>
        <label><span data-i18n="globalSettings.tasksFilterProvider">服务商</span><select id="consoleProviderFilter"><option value="">全部</option></select></label>
        <label><span data-i18n="globalSettings.tasksFilterProject">项目</span><select id="consoleProjectFilter"><option value="">全部</option></select></label>
      </div>
      <div id="taskConsoleList" class="task-console-list" role="list"></div>
    </section>
  </main>
  <script src="/static/js/global-settings.js?v=20261029.153817.0262"></script>
</body>
</html>
